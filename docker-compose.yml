services:
  mongodb:
    image: mongo:7
    container_name: content-scraper-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-scraper}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-scraper}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-content_scraper}
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "${MONGO_USER:-scraper}",
          "-p",
          "${MONGO_PASSWORD:-scraper}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongodb_data:
